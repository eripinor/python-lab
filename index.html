n orientativa\nprint(\"Practicar\")", "hint": "Comprueba los tipos, condiciones o métodos que necesitas."}]}, {"name": "Python Variables", "desc": "Asignación y uso de variables.", "ex": [{"prompt": "Crea producto y precio y muéstralos.", "starter": "producto = \"Comic\"\nprecio = 12.5\nprint(producto, precio)", "solution": "producto = \"Comic\"\nprecio = 12.5\nprint(producto, precio)", "hint": "Recuerda la sintaxis del tema y utiliza print() para mostrar el resultado."}, {"prompt": "Crea tres variables de distintos tipos y muestra sus valores.", "starter": "# Escribe tu código aquí\n", "solution": "# Solución orientativa\nprint(\"Practicar\")", "hint": "Divide el problema en pasos pequeños y prueba cada uno."}, {"prompt": "Intercambia los valores de dos variables y muéstralos.", "starter": "# Escribe tu código aquí\n", "solution": "# Solución orientativa\nprint(\"Practicar\")", "hint": "Comprueba los tipos, condiciones o métodos que necesitas."}]}, {"name": "Python Data Types", "desc": "Tipos básicos y type().", "ex": [{"prompt": "Crea una variable entero, otra texto y otra decimal y muestra sus tipos.", "starter": "edad = 30\nprint(type(edad))", "solution": "entero = 30\ntexto = \"Python\"\ndecimal = 3.5\nprint(type(entero), type(texto), type(decimal))", "hint": "Recuerda la sintaxis del tema y utiliza print() para mostrar el resultado."}, {"prompt": "Comprueba el tipo de una variable que contenga True.", "starter": "# Escribe tu código aquí\n", "solution": "# Solución orientativa\nprint(\"Practicar\")", "hint": "Divide el problema en pasos pequeños y prueba cada uno."}, {"prompt": "Crea una lista y muestra su tipo.", "starter": "# Escribe tu código aquí\n", "solution": "# Solución orientativa\nprint(\"Practicar\")", "hint": "Comprueba los tipos, condiciones o métodos que necesitas."}]}, {"name": "Python Numbers", "desc": "Valores numéricos y operaciones.", "ex": [{"prompt": "Calcula y muestra suma, resta, multiplicación y división de 8 y 3.", "starter": "a = 8\nb let pyodide=null,active=0,completed=JSON.parse(localStorage.getItem('pyLabDone')||'{}');
const nav=document.getElementById('nav');
LEVELS.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i+1).toString().padStart(2,'0')+' · '+l.name;b.onclick=()=>show(i);nav.appendChild(b)});
function updateProgress(){let total=LEVELS.reduce((n,l)=>n+l.ex.length,0),done=Object.keys(completed).length;document.getElementById('progressbar').style.width=(100*done/total)+'%';document.getElementById('progresslabel').textContent=done+' / '+total+' ejercicios marcados';nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===active))}
function show(i){active=i;updateProgress();const l=LEVELS[i];let html=`<section class="hero"><div class="pill">TEMA ${i+1} / ${LEVELS.length}</div><h1>${l.name}</h1><p>${l.desc}</p><div class="kpis"><div class="kpi"><strong>${l.ex.length}</strong>Ejercicios</div><div class="kpi"><strong>${i+1}/35</strong>Temas</div><div class="kpi"><strong>${Object.keys(completed).length}</strong>Marcados</div><div class="kpi"><strong>Python</strong>En navegador</div></div></section>`;
l.ex.forEach((e,j)=>{let key=i+'-'+j;html+=`<article class="exercise"><div class="exercise-top"><h4>Ejercicio ${j+1}</h4><label><input class="check" type="checkbox" ${completed[key]?'checked':''} onchange="mark('${key}',this.checked)"> Marcar como completado</label></div><p>${e.prompt}</p><div class="tools"><button class="btn primary" onclick="runCode('${key}')">▶ Ejecutar</button><button class="btn" onclick="hint('${key}')">Pista</button><button class="btn" onclick="solution('${key}')">Solución orientativa</button><button class="btn" onclick="clearCode('${key}')">Limpiar</button></div><textarea id="editor-${key}" class="editor" spellcheck="false">${e.starter.replaceAll('<','&lt;')}</textarea><div id="out-${key}" class="output">La salida aparecerá aquí.</div><div id="hint-${key}" class="output hidden">${e.hint}</div><div id="sol-${key}" class="output hidden"><pre>${e.solution.replaceAll('<','&lt;')}</pre></div></article>`});html+=`<div class="card"><button class="btn" onclick="show(${Math.max(0,i-1)})">← Tema anterior</button> <button class="btn primary" onclick="show(${Math.min(LEVELS.length-1,i+1)})">Tema siguiente →</button></div>`;document.getElementById('main').innerHTML=html;updateProgress()}
function mark(key,val){if(val)completed[key]=true;else delete completed[key];localStorage.setItem('pyLabDone',JSON.stringify(completed));updateProgress()}
function hint(key){let el=document.getElementById('hint-'+key);el.classList.toggle('hidden')}
function solution(key){document.getElementById('sol-'+key).classList.toggle('hidden')}
function clearCode(key){document.getElementById('editor-'+key).value='';document.getElementById('out-'+key).textContent='';}
async function runCode(key){if(!pyodide){document.getElementById('out-'+key).textContent='Python aún se está cargando. Espera un momento.';return}let out=document.getElementById('out-'+key);out.textContent='Ejecutando…';try{let code=document.getElementById('editor-'+key).value;pyodide.setStdout({batched:(s)=>{out.textContent+=s}});pyodide.setStderr({batched:(s)=>{out.textContent+=s}});out.textContent='';await pyodide.runPythonAsync(code);if(!out.textContent)out.textContent='Código ejecutado. No produjo salida (¿has utilizado print?).'}catch(e){out.textContent='Error de Python:\n'+e;out.classList.add('err')}finally{out.classList.remove('err')}}
function resetProgress(){if(confirm('¿Reiniciar todos los ejercicios marcados?')){completed={};localStorage.removeItem('pyLabDone');show(active)}}
show(0);async function initPython(){try{pyodide=await loadPyodide();document.getElementById('status').textContent='Python listo · ejecuta tus códigos';document.getElementById('status').classList.add('ok')}catch(e){document.getElementById('status').textContent='No se pudo cargar Python · revisa la conexión'}}initPython();
